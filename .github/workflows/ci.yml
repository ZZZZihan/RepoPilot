name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      UV_PYTHON: "3.12.12"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact candidate identity
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -eu
          actual_sha="$(git rev-parse HEAD)"
          actual_tree="$(git rev-parse 'HEAD^{tree}')"
          test "$actual_sha" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          {
            echo "### Candidate identity"
            echo
            echo "- commit: \`$actual_sha\`"
            echo "- tree: \`$actual_tree\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.10.0"
          enable-cache: false

      - name: Install Python
        run: uv python install 3.12.12

      - name: Install locked dependencies from official PyPI
        run: |
          set -eu
          uv sync \
            --locked \
            --all-groups \
            --no-install-project \
            --no-cache \
            --no-config \
            --no-editable \
            --no-sources \
            --default-index https://pypi.org/simple
          uv sync \
            --locked \
            --all-groups \
            --no-build-isolation \
            --no-cache \
            --no-config \
            --no-editable \
            --no-sources \
            --default-index https://pypi.org/simple

      - name: Run local CI contract
        run: UV_NO_SYNC=1 make check

      - name: Run M0 HTTP persistence smoke
        run: UV_NO_SYNC=1 make smoke-m0

      - name: Build source and wheel distributions
        run: >-
          uv build
          --no-build-isolation
          --no-sources
          --no-cache
          --no-config
          --python 3.12.12
          --default-index https://pypi.org/simple
          --out-dir "$RUNNER_TEMP/repopilot-dist"
