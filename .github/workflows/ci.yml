name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      UV_PYTHON: "3.12.12"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.10.0"
          enable-cache: false

      - name: Install Python
        run: uv python install 3.12.12

      - name: Install locked dependencies from official PyPI
        run: >-
          uv sync
          --locked
          --all-groups
          --no-cache
          --no-config
          --no-editable
          --default-index https://pypi.org/simple

      - name: Run local CI contract
        run: UV_NO_SYNC=1 make check

      - name: Build source and wheel distributions
        run: >-
          uv build
          --no-sources
          --no-cache
          --no-config
          --python 3.12.12
          --default-index https://pypi.org/simple
          --out-dir "$RUNNER_TEMP/repopilot-dist"
