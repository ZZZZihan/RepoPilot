[project]
name = "repopilot"
version = "0.1.0"
description = "Evidence-backed implementation planning for small Python repositories"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.28,<1.0",
  "pydantic>=2.10,<3.0",
  "uvicorn>=0.34,<1.0",
]

[dependency-groups]
dev = [
  # Starlette 1.6 selects httpx2 as the FastAPI TestClient backend.
  # Keep the build backend and its transitive requirements inside uv.lock so
  # candidate distributions can be built without an independently resolved environment.
  "hatchling==1.32.0",
  "httpx2>=2.10,<3.0",
  "mypy>=1.15,<2.0",
  "pytest>=8.3,<10.0",
  "ruff>=0.11,<1.0",
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repopilot"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
norecursedirs = ["tests/fixtures"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
